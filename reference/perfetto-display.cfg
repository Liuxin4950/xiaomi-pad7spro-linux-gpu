# Same-device display validation. Raw traces may contain private app/input data.
# 60 seconds; no system setting or service changes.
buffers { size_kb: 32768 fill_policy: RING_BUFFER }
duration_ms: 60000
data_sources { config { name: "linux.ftrace" ftrace_config {
 ftrace_events: "sched/sched_switch"
 ftrace_events: "sched/sched_waking"
 ftrace_events: "power/cpu_frequency"
 ftrace_events: "power/cpu_idle"
 ftrace_events: "ftrace/print"
 atrace_categories: "gfx"
 atrace_categories: "view"
 atrace_categories: "input"
 atrace_categories: "wm"
 # Includes the native root-side server nice-name; raw trace stays private.
 atrace_apps: "*"
 } } }
data_sources { config { name: "linux.process_stats" process_stats_config {
 scan_all_processes_on_start: true
 proc_stats_poll_ms: 1000
 } } }
data_sources { config { name: "android.surfaceflinger.frametimeline" } }
data_sources { config { name: "android.power" android_power_config {
 battery_poll_ms: 1000
 battery_counters: BATTERY_COUNTER_CAPACITY_PERCENT
 battery_counters: BATTERY_COUNTER_CHARGE
 battery_counters: BATTERY_COUNTER_CURRENT
 collect_power_rails: true
 } } }
